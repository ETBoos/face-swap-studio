[project]
name = "face-swap-studio"
version = "0.1.0"
description = "剧组换脸预览工作站 — FaceSwap Studio (product shell + engine adapter stubs)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — commercial film-crew license" }
authors = [{ name = "FaceSwap Studio" }]
keywords = ["film", "face-swap", "preview", "crew", "deepfacelive"]
dependencies = [
    "PySide6>=6.6.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
face-swap-studio = "face_swap_studio.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
