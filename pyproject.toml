[project]
name = "face-swap-studio"
version = "0.2.0a1"
description = "FaceSwap Studio — local real-time face swap for video calls and streaming"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "FaceSwap Studio" }]
keywords = ["face-swap", "realtime", "streaming", "video-calls"]
dependencies = [
    "PySide6>=6.6.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
build = [
    "pyinstaller==6.22.3",
]

[project.scripts]
face-swap-studio = "face_swap_studio.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
